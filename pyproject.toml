[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-flow"
version = "0.1.0"
description = "Push-to-Talk Diktat-Tool: F8 halten, sprechen, Text im aktiven Fenster. OpenAI Whisper + Claude Cleanup."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bastian Galvanek" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    "pycaw>=20240210",
    "comtypes>=1.4.0",
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
voice-flow = "voice_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Branding-Assets (Logo/Icon) reisen mit jeder Installation mit -> Pille zeigt
# das Logo immer, unabhaengig von Start-Verzeichnis oder Install-Modus.
[tool.setuptools.package-data]
voice_flow = ["assets/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length wird vom Formatter erzwungen

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
