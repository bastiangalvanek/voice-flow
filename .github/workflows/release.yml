name: Release

# Baut die fertigen Programme fuer macOS (DMG) und Windows (ZIP mit .exe) und
# haengt sie an das Release. Ausgeloest von einem Tag v* oder von Hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z.B. 0.3.0"
        required: true
        default: "0.3.0"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: PYTHONPATH=src python -m pytest -q
      - name: App bauen
        run: pyinstaller voice-flow.spec --noconfirm --distpath dist --workpath build_tmp/pyi
      - name: DMG bauen
        run: bash packaging/make_dmg.sh "${{ github.event.inputs.version || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: |
          $env:PYTHONPATH="src"
          python -m pytest -q
      - name: EXE bauen
        run: pyinstaller voice-flow.spec --noconfirm --distpath dist --workpath build_tmp/pyi
      - name: Installationsprogramm bauen (Inno Setup)
        run: |
          $version = ("${{ github.event.inputs.version || github.ref_name }}") -replace '^v',''
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyVersion=$version packaging\windows-installer.iss
      - name: ZIP als zweite Variante packen
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path dist/VoiceFlow/* -DestinationPath "dist/VoiceFlow-$version-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist/*.exe
            dist/*.zip
      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
